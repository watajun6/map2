<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Company List</title>
     <!--<link rel="stylesheet" href="./css/style.css" type="text/css">-->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>Companies 一 覧</h1>
    <table>
        <thead>
            <tr>
                <th>Member Name</th>
                <th>Company Name</th>
                <th>Company Address</th>
                <th>Contact Email</th>
                <th>Phone Number</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="company : ${companiesPage}">
                <td th:text="${company.memberName}"></td>
                <td th:text="${company.companyName}"></td>
                <td th:text="${company.companyAddress}"></td>
                <td th:text="${company.contactEmail}"></td>
                <td th:text="${company.phoneNumber}"></td>
            </tr>
        </tbody>
    </table>
    
    <!-- ページ数が1ページ以上の場合にのみページネーションを表示 -->
    <div th:if="${companiesPage.getTotalPages() > 1}" class="d-flex justify-content-center">
		
		<nav aria-label="Page navigation">
		    <ul class="pagination">
				<!-- 前のページボタン -->
		        <li class="page-item　disabled" th:classappend="${companiesPage.hasPrevious()} ? '' : 'disabled'">
		            <a class="page-link" th:href="@{/admin/companies(page=${companiesPage.number - 1})}" aria-label="Previous">
		                <span aria-hidden="true">&laquo;</span>
		            </a>
		        </li>
		        
		        <!-- 各ページ番号 -->
		        <li class="page-item　active" th:each="i : ${#numbers.sequence(0, companiesPage.totalPages - 1)}"
		            th:classappend="${companiesPage.number == i} ? 'active'">
		            <a class="page-link" th:href="@{/admin/companies(page=${i})}" th:text="${i + 1}"></a>
		        </li>
		        
		        <!-- 次のページボタン -->
		        <li class="page-item" th:classappend="${companiesPage.hasNext()} ? '' : 'disabled'">
		            <a class="page-link" th:href="@{/admin/companies(page=${companiesPage.number + 1})}" aria-label="Next">
		                <span aria-hidden="true">&raquo;</span>
		            </a>
		        </li>
		    </ul>
 		</nav>
 	</div>
</body>
</html>
