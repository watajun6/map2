<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Company List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ccc;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        .pagination {
            margin-top: 20px;
            list-style: none;
            padding: 0;
            display: flex;
        }
        .pagination li {
            margin-right: 5px;
        }
        .pagination .active a {
            font-weight: bold;
        }
        .disabled a {
            pointer-events: none;
            color: #999;
        }
    </style>
</head>
<body>
    <h1>会社 一覧</h1>
    
	<!-- 検索フォーム -->
    <form th:action="@{/admin/company}" method="get">
    <input type="text" name="search2" th:value="${search2}" placeholder="会社名、住所、ユーザー名で検索">
    <button type="submit">検索</button>

	<!-- 一覧表示 -->
    <table>
        <thead>
            <tr>
                <th>Member Name</th>
                <th>Company Name</th>
                <th>Company Address</th>
                <th>Contact Email</th>
                <th>Phone Number</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="company : ${companiesPage}">
                <td th:text="${company.memberName}"></td>
                <td>
                    <!-- 会社名をクリックすると詳細画面（/admin/company/show/{companyId}）へ遷移 -->
                    <a th:href="@{'/admin/company/show/' + ${company.companyId}}"
                       th:text="${company.companyName}"></a>
                </td>
                <td th:text="${company.companyName}"></td>
                <td th:text="${company.companyAddress}"></td>
                <td th:text="${company.contactEmail}"></td>
                <td th:text="${company.phoneNumber}"></td>
            </tr>
        </tbody>
    </table>
    
    <!-- ページ数が1ページ以上の場合にのみページネーションを表示 -->
    <div th:if="${companiesPage.getTotalPages() > 1}" class="d-flex justify-content-center">
		
		<nav aria-label="Page navigation">
		    <ul class="pagination">
				<!-- 前のページボタン -->
		        <li class="page-item　disabled" th:classappend="${companiesPage.hasPrevious()} ? '' : 'disabled'">
		            <a class="page-link" th:href="@{/admin/company(page=${companiesPage.number - 1})}" aria-label="Previous">
		                <span aria-hidden="true">&laquo;</span>
		            </a>
		        </li>
		        
		        <!-- 各ページ番号 -->
		        <li class="page-item　active" th:each="i : ${#numbers.sequence(0, companiesPage.totalPages - 1)}"
		            th:classappend="${companiesPage.number == i} ? 'active'">
		            <a class="page-link" th:href="@{/admin/company(page=${i})}" th:text="${i + 1}"></a>
		        </li>
		        
		        <!-- 次のページボタン -->
		        <li class="page-item" th:classappend="${companiesPage.hasNext()} ? '' : 'disabled'">
		            <a class="page-link" th:href="@{/admin/company(page=${companiesPage.number + 1})}" aria-label="Next">
		                <span aria-hidden="true">&raquo;</span>
		            </a>
		        </li>
		    </ul>
 		</nav>
 	</div>
</body>
</html>
